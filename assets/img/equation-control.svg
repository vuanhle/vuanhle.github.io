<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fundamental equations of control</title>
  <desc id="desc">State-space dynamics, optimal control, and feedback control.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="36" y="36" width="1128" height="603" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="80" y="105" fill="#111111" font-family="Times New Roman, Times, serif" font-size="34">Control and autonomy</text>
  <line x1="80" y1="130" x2="1120" y2="130" stroke="#b8b8b8" stroke-width="1"/>

  <text x="600" y="235" text-anchor="middle" fill="#111111" font-family="Times New Roman, Times, serif" font-size="44">
    ẋ(t) = Ax(t) + Bu(t)
  </text>
  <text x="600" y="285" text-anchor="middle" fill="#555555" font-family="Times New Roman, Times, serif" font-size="23">
    Model how the state evolves under a control input
  </text>

  <text x="600" y="400" text-anchor="middle" fill="#111111" font-family="Times New Roman, Times, serif" font-size="38">
    u* = arg minᵤ ∫₀ᵀ [xᵀQx + uᵀRu] dt
  </text>
  <text x="600" y="450" text-anchor="middle" fill="#555555" font-family="Times New Roman, Times, serif" font-size="23">
    Balance state error against the cost of acting
  </text>

  <text x="600" y="555" text-anchor="middle" fill="#111111" font-family="Times New Roman, Times, serif" font-size="44">
    u(t) = −Kx(t)
  </text>
  <text x="600" y="600" text-anchor="middle" fill="#555555" font-family="Times New Roman, Times, serif" font-size="23">
    Use feedback to stabilize the system as conditions change
  </text>
</svg>
