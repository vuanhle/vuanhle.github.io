<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fundamental equations of deep learning</title>
  <desc id="desc">Empirical risk minimization, neural network composition, and gradient descent.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="36" y="36" width="1128" height="603" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="80" y="105" fill="#111111" font-family="Times New Roman, Times, serif" font-size="34">Deep learning theory</text>
  <line x1="80" y1="130" x2="1120" y2="130" stroke="#b8b8b8" stroke-width="1"/>

  <text x="600" y="235" text-anchor="middle" fill="#111111" font-family="Times New Roman, Times, serif" font-size="43">
    θ̂ = arg min  (1/n) Σᵢ ℓ(fθ(xᵢ), yᵢ)
  </text>
  <text x="600" y="285" text-anchor="middle" fill="#555555" font-family="Times New Roman, Times, serif" font-size="23">
    Learn parameters by minimizing prediction error on observed data
  </text>

  <text x="600" y="400" text-anchor="middle" fill="#111111" font-family="Times New Roman, Times, serif" font-size="40">
    fθ(x) = Wₗ σ(Wₗ₋₁ ··· σ(W₁x))
  </text>
  <text x="600" y="450" text-anchor="middle" fill="#555555" font-family="Times New Roman, Times, serif" font-size="23">
    Compose linear maps and nonlinearities into a deep representation
  </text>

  <text x="600" y="555" text-anchor="middle" fill="#111111" font-family="Times New Roman, Times, serif" font-size="40">
    θₜ₊₁ = θₜ − η ∇θ L(θₜ)
  </text>
  <text x="600" y="600" text-anchor="middle" fill="#555555" font-family="Times New Roman, Times, serif" font-size="23">
    Update the model along the negative loss gradient
  </text>
</svg>
